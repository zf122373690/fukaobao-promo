<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f0e5">
<title>T3 本地助手 · 交互演示</title>
<style>
/* ============================================================
   T3 本地设备助手 · 暖纸橙（浅色默认）+ 暖黑橙（深色）
   与固件 html_ui 「Juquan console theme」同一设计语言。
   本文件为官网演示版：界面 1:1 对齐本地助手，数据全部为本地模拟。
   ============================================================ */
:root {
  --bg: #f7f0e5;
  --bg-card: #fffdf7;
  --bg-card2: #fff7e9;
  --bg-input: #fffdfa;
  --border: #29261f;
  --border-subtle: #d9cdbb;
  --fg: #24211c;
  --fg-dim: #625a4d;
  --fg-muted: #8f8372;
  --accent: #f25b24;
  --accent-h: #d94716;
  --accent-subtle: rgba(242, 91, 36, 0.1);
  --accent-border: rgba(242, 91, 36, 0.38);
  --accent-glow: rgba(242, 91, 36, 0.12);
  --on-accent: #fffdf7;
  --green: #467b43;
  --green-subtle: rgba(70, 123, 67, 0.1);
  --green-border: rgba(70, 123, 67, 0.32);
  --amber: #bd7a00;
  --amber-subtle: rgba(255, 201, 74, 0.28);
  --red: #bd4038;
  --red-h: #9f302a;
  --red-subtle: rgba(189, 64, 56, 0.08);
  --red-border: rgba(189, 64, 56, 0.3);
  --btn-hover: #eee3d2;
  --bar: rgba(255, 250, 240, 0.97);
  --grad-accent: linear-gradient(135deg, #f25b24 0%, #d94716 100%);
  --grad-hero: linear-gradient(120deg, #f25b24 0%, #e04f1d 100%);
  --shadow-card: 0 2px 10px rgba(36, 33, 28, 0.06);
  --shadow-float: 0 16px 48px rgba(36, 33, 28, 0.18);
  --radius: 10px;
  --radius-lg: 14px;
  --topbar-h: 56px;
  --tabbar-h: 64px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #171512;
  --bg-card: #211e19;
  --bg-card2: #29251e;
  --bg-input: #181613;
  --border: #5a5750;
  --border-subtle: #3f3c36;
  --fg: #fff8eb;
  --fg-dim: #d6cab8;
  --fg-muted: #9d9180;
  --accent: #ff6a2a;
  --accent-h: #ff824d;
  --accent-subtle: rgba(255, 106, 42, 0.14);
  --accent-border: rgba(255, 106, 42, 0.5);
  --accent-glow: rgba(255, 106, 42, 0.18);
  --on-accent: #241108;
  --green: #86bd68;
  --green-subtle: rgba(134, 189, 104, 0.13);
  --green-border: rgba(134, 189, 104, 0.42);
  --amber: #ffc94a;
  --amber-subtle: rgba(255, 201, 74, 0.13);
  --red: #ff8d82;
  --red-h: #ffa59d;
  --red-subtle: rgba(255, 141, 130, 0.12);
  --red-border: rgba(255, 141, 130, 0.38);
  --btn-hover: #383229;
  --bar: rgba(23, 21, 18, 0.97);
  --grad-accent: linear-gradient(135deg, #ff6a2a 0%, #e05517 100%);
  --grad-hero: linear-gradient(120deg, #ff6a2a 0%, #e05517 100%);
  --shadow-card: 0 6px 22px rgba(0, 0, 0, 0.45);
  --shadow-float: 0 16px 48px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body, #app { height: 100%; }
body {
  margin: 0;
  color: var(--fg);
  font-family: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  background:
    radial-gradient(1000px 500px at 85% -10%, var(--accent-glow), transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(var(--muted-line, rgba(36, 33, 28, 0.04)) 1px, transparent 1px),
    linear-gradient(90deg, var(--muted-line, rgba(36, 33, 28, 0.04)) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(75% 55% at 50% 0%, rgba(0, 0, 0, 0.9), transparent 85%);
  mask-image: radial-gradient(75% 55% at 50% 0%, rgba(0, 0, 0, 0.9), transparent 85%);
  z-index: 0;
}
:root[data-theme="dark"] body::before { --muted-line: rgba(255, 248, 235, 0.03); }
#app { position: relative; z-index: 1; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }
a { color: var(--accent); text-decoration: none; }
code { font-family: 'JetBrains Mono', Consolas, ui-monospace, monospace; font-size: 0.92em; color: var(--accent-h); }
.mono { font-family: 'JetBrains Mono', Consolas, ui-monospace, monospace; }
.muted, .text-muted { color: var(--fg-muted); }
small { color: var(--fg-muted); }
h1, h2, h3 { margin: 0; font-weight: 700; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
button:disabled { opacity: 0.45; cursor: not-allowed; }

/* ============ 演示提示条 ============ */
.demo-banner {
  position: sticky; top: 0; z-index: 55;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; font-size: 12px;
  background: var(--grad-accent); color: var(--on-accent);
}
.demo-banner .pill { background: rgba(255, 255, 255, .22); border-radius: 999px; padding: 1px 9px; font-weight: 600; }
.demo-banner .banner-close { margin-left: auto; font-weight: 700; opacity: .85; text-decoration: underline; white-space: nowrap; }
.demo-banner .banner-close:hover { opacity: 1; }
:root.has-banner .top-nav-bar { top: 31px; }

/* ============ 通用按钮 ============ */
.primary-button, .btn-primary, .mode-enter-button {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 12px 20px; border-radius: var(--radius);
  background: var(--grad-accent);
  color: var(--on-accent); font-size: 15px; font-weight: 700; letter-spacing: 0.04em;
  box-shadow: 0 4px 14px var(--accent-glow);
  transition: transform 0.15s ease, filter 0.15s ease;
}
.primary-button:active, .btn-primary:active, .mode-enter-button:active { transform: scale(0.97); }
.primary-button:hover:not(:disabled), .btn-primary:hover:not(:disabled), .mode-enter-button:hover:not(:disabled) { filter: brightness(1.05); }
.secondary-button, .btn-secondary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--fg-dim); font-size: 14px; font-weight: 500;
  transition: border 0.15s ease, color 0.15s ease, background 0.15s ease;
}
.secondary-button:hover:not(:disabled), .btn-secondary:hover:not(:disabled) { background: var(--btn-hover); border-color: var(--accent-border); color: var(--accent); }
.danger-button, .btn-danger {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; border-radius: var(--radius);
  background: var(--red-subtle); border: 1px solid var(--red-border);
  color: var(--red); font-size: 14px; font-weight: 500;
}
.btn-action {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  padding: 7px 12px; border-radius: 8px;
  background: var(--bg-card); border: 1px solid var(--border-subtle);
  color: var(--fg-dim); font-size: 12.5px;
}
.btn-action.btn-danger { background: var(--red-subtle); border-color: var(--red-border); color: var(--red); }
.btn-action:disabled { opacity: 0.4; }
.btn-action:hover:not(:disabled) { border-color: var(--accent-border); color: var(--accent); }
.small-action {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 8px 12px; border-radius: 8px;
  background: var(--bg-card); border: 1px solid var(--border-subtle);
  color: var(--fg-dim); font-size: 12.5px;
}
.btn-logout {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px; border-radius: var(--radius-lg);
  background: var(--red-subtle); border: 1px solid var(--red-border); color: var(--red); font-size: 15px; font-weight: 600;
}
svg { flex-shrink: 0; }

/* ============ 表单 ============ */
input, textarea, select {
  width: 100%; font-family: inherit; font-size: 15px; color: var(--fg);
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius); padding: 11px 14px;
  outline: none; transition: border 0.15s ease, box-shadow 0.15s ease;
}
input::placeholder, textarea::placeholder { color: var(--fg-muted); }
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
textarea { resize: vertical; min-height: 72px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--fg-muted) 50%), linear-gradient(135deg, var(--fg-muted) 50%, transparent 50%); background-position: calc(100% - 19px) 50%, calc(100% - 14px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
input[type="checkbox"], input[type="radio"] { width: 16px; height: 16px; min-width: 16px; padding: 0; flex-shrink: 0; accent-color: var(--accent); border-radius: 4px; }
input[type="file"] { padding: 8px; font-size: 12.5px; color: var(--fg-muted); background: var(--bg-input); }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; margin-bottom: 7px; font-size: 13px; color: var(--fg-dim); font-weight: 500; }
.hint { font-size: 12.5px; color: var(--fg-muted); }
label { display: block; }
label > span { display: block; }
label input, label select, label textarea { margin-top: 6px; }
label div input, label div select { margin-top: 0; }
.form-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.full-field { grid-column: 1 / -1; }
.error, .inline-error {
  padding: 11px 14px; border-radius: var(--radius); font-size: 13.5px; margin: 10px 0;
  background: var(--red-subtle); border: 1px solid var(--red-border); color: var(--red);
  word-break: break-all;
}
.inline-error.success, .success { background: var(--green-subtle); border-color: var(--green-border); color: var(--green); }
.empty {
  padding: 44px 16px; text-align: center; color: var(--fg-muted); font-size: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  border: 1px dashed var(--border-subtle); border-radius: var(--radius-lg);
  background: var(--bg-card2);
}

/* ============ 页面骨架 ============ */
.app-shell-topnav { display: flex; flex-direction: column; height: 100%; }
.top-nav-bar {
  height: var(--topbar-h); flex-shrink: 0;
  display: flex; align-items: center; gap: 10px; padding: 0 18px;
  background: var(--bar);
  border-bottom: 1px solid var(--border-subtle);
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: blur(10px);
}
.top-nav-logo { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-mark-sm {
  width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--grad-accent); color: var(--on-accent); font-weight: 800; font-size: 13px;
}
.top-nav-logo-copy { display: flex; flex-direction: column; min-width: 0; text-align: left; }
.top-nav-logo-copy strong { font-size: 14.5px; }
.top-nav-logo-copy small { font-size: 11px; color: var(--fg-muted); }
.top-nav-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.top-nav-icon-btn, .top-nav-logout {
  width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--fg-dim);
}
.top-nav-icon-btn:hover, .top-nav-logout:hover { border-color: var(--accent-border); color: var(--accent); }
.top-nav-serial-btn {
  display: inline-flex; align-items: center; gap: 5px; height: 36px; padding: 0 12px;
  border-radius: 8px; background: var(--bg-card);
  border: 1px solid var(--border-subtle); color: var(--fg-dim); font-size: 12.5px; white-space: nowrap;
}
.top-nav-serial-btn:hover { border-color: var(--accent-border); color: var(--accent); }
.content-topnav {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 16px 16px calc(var(--tabbar-h) + 26px);
  width: 100%; margin: 0 auto;
}
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
  padding-bottom: env(safe-area-inset-bottom, 0);
  background: var(--bar);
  border-top: 1px solid var(--border-subtle);
  backdrop-filter: blur(10px);
}
.bottom-nav-group {
  max-width: 720px; margin: 0 auto; height: var(--tabbar-h);
  display: flex; align-items: stretch;
}
.bottom-nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--fg-muted); font-size: 10.5px; position: relative; transition: color 0.15s ease;
}
.bottom-nav-item.active { color: var(--accent); font-weight: 600; }
.bottom-nav-item.active::before {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 34px; height: 2px; background: var(--accent);
}

/* ============ 通用页头 ============ */
.page { display: flex; flex-direction: column; gap: 16px; }
.page-header h1, .page-hero h1 { font-size: 22px; letter-spacing: 0.01em; }
.page-header p, .page-hero p { margin: 3px 0 0; color: var(--fg-muted); font-size: 13px; }
.page-hero { padding: 18px; border-radius: var(--radius-lg); background: var(--bg-card); border: 1px solid var(--border-subtle); }
.eyebrow { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.page-hero .messages-hero-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 13px; }
.page-hero.with-actions { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: flex-start; }

/* ============ 登录页 ============ */
.login-page { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: clamp(24px, 8vh, 72px) 22px 28px; }
.login-title-main { font-size: 26px; font-weight: 800; letter-spacing: 0.06em; margin-bottom: clamp(28px, 6vh, 60px); }
.login-card {
  width: 100%; max-width: 400px;
  padding: 30px 26px 26px; border-radius: var(--radius-lg);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-float);
  display: flex; flex-direction: column;
}
.login-card .field { margin-bottom: 18px; }
.login-remember { display: flex; align-items: center; gap: 9px; margin: 2px 0 22px; font-size: 14px; color: var(--fg-dim); cursor: pointer; user-select: none; }
.login-remember input { width: 16px; height: 16px; margin: 0; }
.login-links { display: flex; justify-content: space-between; margin-top: 18px; font-size: 13px; color: var(--fg-muted); }
.login-links button { color: var(--accent); font-size: 13px; }
.login-foot { margin-top: auto; padding-top: 34px; font-size: 12px; color: var(--fg-muted); }

/* ============ 模式选择 ============ */
.mode-select-page { padding: 26px 18px; gap: 20px; }
.mode-hero { text-align: center; padding-top: 18px; }
.mode-hero h1 { font-size: 24px; }
.mode-hero p { color: var(--fg-muted); font-size: 13.5px; margin: 6px 0 0; }
.mode-hero-badge {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
  padding: 6px 14px; border-radius: 999px; font-size: 12px; color: var(--accent);
  background: var(--accent-subtle); border: 1px solid var(--accent-border);
}
.mode-choice-grid { display: grid; gap: 14px; margin-top: 8px; }
.mode-choice-card { text-align: left; padding: 18px; border-radius: var(--radius-lg); background: var(--bg-card); border: 1px solid var(--border-subtle); transition: border 0.15s ease, transform 0.15s ease; cursor: pointer; }
.mode-choice-card:hover { border-color: var(--accent-border); transform: translateY(-1px); }
.mode-choice-card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
.mode-choice-icon {
  width: 44px; height: 44px; border-radius: 10px; margin-bottom: 12px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-subtle); color: var(--accent);
}
.mode-choice-card h2 { font-size: 17px; }
.mode-choice-card > p { margin: 5px 0 0; font-size: 13px; color: var(--fg-muted); }
.mode-check-list { margin: 12px 0 14px; padding: 0; list-style: none; display: grid; gap: 5px; }
.mode-check-list li { font-size: 12.5px; color: var(--fg-muted); display: flex; gap: 6px; align-items: center; }
.mode-check-list li::before { content: '✓'; color: var(--green); font-weight: 700; }

/* ============ 仪表盘 ============ */
.dashboard-page { gap: 18px; }
.dash-hello {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 20px; border-radius: var(--radius-lg);
  background: var(--grad-hero);
  box-shadow: 0 8px 24px var(--accent-glow);
}
.dash-hello h1 { font-size: 20px; color: var(--on-accent); }
.dash-hello p { margin: 3px 0 0; font-size: 12.5px; color: var(--on-accent); opacity: 0.85; }
.dash-mode-chip {
  display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
  padding: 6px 12px; border-radius: 999px; font-size: 12px;
  background: rgba(255, 255, 255, 0.18); color: var(--on-accent); border: 1px solid rgba(255, 255, 255, 0.35);
  white-space: nowrap;
}
.dash-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.dash-stat {
  padding: 14px 6px; border-radius: var(--radius-lg); text-align: center;
  background: var(--bg-card); border: 1px solid var(--border-subtle);
  display: flex; flex-direction: column; gap: 3px;
}
.dash-stat:hover { border-color: var(--accent-border); }
.dash-stat strong { font-size: 22px; font-weight: 800; color: var(--fg); }
.dash-stat span { font-size: 11px; color: var(--fg-muted); }
.dash-stat.online strong { color: var(--green); }
.dash-stat.nosim strong { color: var(--amber); }
.dash-stat.registered strong { color: var(--accent); }
.dash-quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.dash-quick button {
  padding: 13px 4px; border-radius: var(--radius-lg);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
  display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 11.5px; color: var(--fg-dim);
}
.dash-quick button:hover { border-color: var(--accent-border); }
.quick-ico {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-subtle); color: var(--accent);
}
.quick-ico.green { background: var(--green-subtle); color: var(--green); }
.quick-ico.amber { background: var(--amber-subtle); color: var(--amber); }
.quick-ico.blue { background: var(--accent-subtle); color: var(--accent); }
.dash-recent-header { display: flex; align-items: center; justify-content: space-between; }
.dash-recent-header h2 { font-size: 15.5px; }
.dash-recent-header button { font-size: 12.5px; color: var(--accent); }
.dash-device-list { display: flex; flex-direction: column; gap: 10px; }
.dash-device {
  display: flex; align-items: center; gap: 11px; text-align: left; min-width: 0; max-width: 100%;
  padding: 13px 14px; border-radius: var(--radius-lg);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
}
.dash-device:hover { border-color: var(--accent-border); }
.dash-device.offline { opacity: 0.6; }
.dd-status { width: 9px; height: 9px; border-radius: 50%; background: var(--border-subtle); flex-shrink: 0; }
.dash-device:not(.offline) .dd-status { background: var(--green); }
.dd-main { min-width: 0; flex: 1; }
.dd-main strong { display: block; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-main small { display: block; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-sims { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
.dd-sims small { font-size: 11px; color: var(--fg-muted); }
.dd-meta { font-size: 11.5px; color: var(--fg-muted); flex-shrink: 0; }
.dd-meta.ok { color: var(--green); }

/* ============ 设备页 ============ */
.devices-page { gap: 14px; }
.version-banner {
  display: flex; flex-wrap: wrap; gap: 6px 14px;
  padding: 10px 14px; border-radius: var(--radius); font-size: 11.5px; color: var(--fg-muted);
  background: var(--bg-card2); border: 1px solid var(--border-subtle);
}
.stats-bar { display: flex; flex-wrap: wrap; gap: 7px; }
.stat-item {
  padding: 7px 13px; border-radius: 999px; font-size: 12px; color: var(--fg-dim);
  background: var(--bg-card2); border: 1px solid var(--border-subtle);
  white-space: nowrap;
}
.stat-item.stat-online { color: var(--green); border-color: var(--green-border); }
.stat-item.stat-nosim { color: var(--amber); border-color: var(--amber-subtle); }
.stat-item.stat-sim { color: var(--amber); }
.stat-item.stat-registered { color: var(--accent); border-color: var(--accent-border); }
.stat-item.stat-auto-refresh { color: var(--fg-muted); }
.filter-chips { display: flex; gap: 9px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
.filter-chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 8px 18px; border-radius: 999px; font-size: 13.5px; color: var(--fg-dim);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
  transition: all 0.15s ease;
}
.chip.active { color: var(--on-accent); background: var(--grad-accent); border-color: transparent; font-weight: 600; }
.search-bar { position: relative; }
.search-bar .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--fg-muted); pointer-events: none; }
.search-bar input { padding-left: 42px; }
.device-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.dev-card {
  padding: 15px 16px 13px; border-radius: var(--radius-lg);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
  min-width: 0; max-width: 100%;
}
.dev-card:hover { border-color: var(--accent-border); }
.dev-card-top { display: flex; align-items: center; gap: 9px; }
.dev-card-check { margin-right: 2px; }
.dev-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border-subtle); flex-shrink: 0; }
.dev-card.online .dev-dot { background: var(--green); }
.dev-card-top strong { flex: 1; min-width: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dev-badge {
  flex-shrink: 0; padding: 3px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  background: var(--green-subtle); color: var(--green); border: 1px solid var(--green-border);
}
.dev-badge.off { background: var(--bg-card2); color: var(--fg-muted); border-color: var(--border-subtle); }
.dev-sim-rows { margin: 12px 0 10px; display: grid; gap: 8px; }
.dev-sim-row {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  padding: 9px 12px; border-radius: var(--radius);
  background: var(--bg-card2); border: 1px solid var(--border-subtle);
  font-size: 13px; min-width: 0;
}
.dev-sim-tag { flex-shrink: 0; padding: 2px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 700; background: var(--accent-subtle); color: var(--accent); }
.dev-sim-row .num { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 600; color: var(--fg); overflow-wrap: anywhere; }
.dev-sim-row .meta { margin-left: auto; font-size: 11.5px; color: var(--fg-muted); text-align: right; min-width: 0; }
.dev-meta-row {
  display: flex; flex-wrap: wrap; gap: 5px 16px; padding-top: 10px;
  border-top: 1px dashed var(--border-subtle); font-size: 11.5px; color: var(--fg-muted);
}
.dev-meta-row b { color: var(--fg-dim); font-weight: 500; }
.dev-actions { display: flex; gap: 7px; margin-top: 11px; flex-wrap: wrap; padding-top: 2px; }
.dev-actions::-webkit-scrollbar { display: none; }
.dev-actions .btn-action { flex-shrink: 0; }
.dev-select-row { display: flex; align-items: center; gap: 9px; }
.batch-bar {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  padding: 12px 14px; border-radius: var(--radius-lg);
  background: var(--accent-subtle); border: 1px solid var(--accent-border);
}
.fab {
  position: fixed; right: 18px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 18px);
  z-index: 42;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--grad-accent); color: var(--on-accent);
  box-shadow: 0 8px 22px var(--accent-glow);
  font-size: 10.5px; font-weight: 700;
  transition: transform 0.15s ease;
}
.fab:active { transform: scale(0.94); }

/* ============ 弹窗 ============ */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center; padding: 18px;
  background: rgba(36, 33, 28, 0.5); backdrop-filter: blur(4px);
  animation: fade-in 0.18s ease;
}
:root[data-theme="dark"] .modal-backdrop { background: rgba(0, 0, 0, 0.7); }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.modal-panel {
  width: 100%; max-width: 440px; max-height: 86vh; overflow-y: auto;
  padding: 20px 18px; border-radius: var(--radius-lg);
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-float);
  animation: pop-in 0.2s ease;
}
@keyframes pop-in { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: none; } }
.modal-panel.modal-large { max-width: 720px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.modal-header h2 { font-size: 17px; }
.modal-header button { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: var(--bg-card2); color: var(--fg-dim); }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.modal-actions > * { flex: 1; min-width: 110px; }

/* ============ 接管面板 ============ */
.takeover-content { display: flex; flex-direction: column; gap: 14px; }
.takeover-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.takeover-metrics > div {
  padding: 10px 6px; border-radius: var(--radius); text-align: center;
  background: var(--bg-card2); border: 1px solid var(--border-subtle);
}
.takeover-metrics span { display: block; font-size: 10.5px; color: var(--fg-muted); }
.takeover-metrics strong { font-size: 12.5px; color: var(--fg); font-weight: 600; word-break: break-all; }
.save-config-bar { display: flex; gap: 10px; }
.save-config-bar .btn-primary { flex: 1; }
.takeover-nav { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
.takeover-nav::-webkit-scrollbar { display: none; }
.takeover-nav button {
  flex-shrink: 0; padding: 8px 15px; border-radius: 999px; font-size: 13px; color: var(--fg-dim);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
  transition: all 0.15s ease;
}
.takeover-nav button.active { color: var(--on-accent); background: var(--grad-accent); border-color: transparent; font-weight: 600; }
.takeover-grid { display: flex; flex-direction: column; gap: 14px; }
.takeover-card {
  padding: 15px 14px; border-radius: var(--radius-lg);
  background: var(--bg-card2); border: 1px solid var(--border-subtle);
  display: flex; flex-direction: column; gap: 11px;
}
.takeover-card h3 { font-size: 14.5px; margin-bottom: 2px; color: var(--accent); }
.takeover-card.accent-blue { border-color: var(--accent-border); }
.takeover-card.accent-green { border-color: var(--green-border); }
.takeover-card.accent-amber { border-color: var(--amber); }
.takeover-card.accent-red { border-color: var(--red-border); }
.takeover-card.accent-slate { border-color: var(--border); }
.takeover-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.channel-tabs { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
.channel-tabs::-webkit-scrollbar { display: none; }
.channel-tabs button {
  flex-shrink: 0; padding: 7px 15px; border-radius: 999px; font-size: 12.5px; color: var(--fg-dim);
  background: var(--bg-input); border: 1px solid var(--border-subtle);
}
.channel-tabs button.active { background: var(--accent-subtle); color: var(--accent); border-color: var(--accent-border); font-weight: 600; }
.serial-command { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.serial-command input { flex: 1; min-width: 130px; }
.serial-command.refined button { flex-shrink: 0; }
.at-response {
  margin: 0; padding: 12px; border-radius: var(--radius); max-height: 240px; overflow: auto;
  background: var(--bg-input); border: 1px solid var(--border-subtle);
  font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; color: var(--green);
  white-space: pre-wrap; word-break: break-all;
}
.diag-result { display: flex; flex-direction: column; gap: 6px; }
.diag-row {
  display: flex; gap: 10px; align-items: flex-start; justify-content: space-between;
  padding: 9px 12px; border-radius: var(--radius); font-size: 12px;
  background: var(--bg-input); border: 1px solid var(--border-subtle);
}
.diag-key { color: var(--accent); font-weight: 600; flex-shrink: 0; }
.diag-val { text-align: right; word-break: break-all; color: var(--fg-dim); font-family: monospace; font-size: 11.5px; }
.ota-progress { display: flex; flex-direction: column; gap: 8px; }
.ota-bar {
  position: relative; height: 22px; border-radius: 11px; overflow: hidden;
  background: var(--bg-input); border: 1px solid var(--border-subtle);
  display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--fg);
}
.ota-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--grad-accent); transition: width 0.4s ease; }
.msg-log { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }

/* ============ 短信页 ============ */
.msg-page { gap: 14px; }
.msg-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.msg-tabs button {
  padding: 8px 16px; border-radius: 999px; font-size: 13px; color: var(--fg-dim);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
}
.msg-tabs button.active { color: var(--on-accent); background: var(--grad-accent); border-color: transparent; font-weight: 600; }
.msg-tabs button em { font-style: normal; opacity: .7; margin-left: 4px; font-size: 12px; }
.msg-toolbar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.msg-toolbar-left { display: flex; gap: 8px; flex: 1; min-width: 0; flex-wrap: wrap; }
.msg-toolbar-right { display: flex; gap: 8px; flex-wrap: wrap; }
.msg-toolbar button { white-space: nowrap; }
.msg-search-wrap { position: relative; flex: 1 1 240px; }
@media (max-width: 560px) {
  .msg-toolbar { flex-direction: column; align-items: stretch; }
  .msg-toolbar-left { flex-direction: column; }
  .msg-search-wrap { flex: 0 0 auto; }
}
.msg-search-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--fg-muted); pointer-events: none; }
.msg-search-wrap input { padding-left: 40px; }
.msg-search-wrap select { margin: 0; }
.msg-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
.msg-stat {
  padding: 12px 6px; border-radius: var(--radius-lg); text-align: center;
  background: var(--bg-card); border: 1px solid var(--border-subtle);
}
.msg-stat-value { font-size: 19px; font-weight: 800; color: var(--fg); }
.msg-stat-label { font-size: 11px; color: var(--fg-muted); }
.msg-pill { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--accent-subtle); color: var(--accent); }
.msg-pill.in { background: var(--green-subtle); color: var(--green); }
.msg-pill.out { background: var(--accent-subtle); color: var(--accent); }
.msg-pill.call { background: var(--amber-subtle); color: var(--amber); }
.msg-table-wrap { border-radius: var(--radius-lg); background: var(--bg-card); border: 1px solid var(--border-subtle); overflow-x: auto; }
.msg-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.msg-table th { padding: 10px 13px; text-align: left; font-size: 11.5px; color: var(--fg-muted); font-weight: 600; background: var(--bg-card2); border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
.msg-table td { padding: 12px 13px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
.msg-table tr:last-child td { border-bottom: none; }
.msg-dir { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--fg-dim); white-space: nowrap; }
.msg-dir.in { color: var(--green); }
.msg-dir.out { color: var(--accent); }
.msg-dir.call { color: var(--amber); }
.msg-content-cell .msg-from { font-weight: 700; font-size: 14px; color: var(--fg); }
.msg-content-cell .msg-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; color: var(--fg-dim); font-size: 13px; }
.msg-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 32px; height: 36px; padding: 0 13px; border-radius: 8px;
  background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--fg-dim); font-size: 13px;
}
.msg-btn:hover:not(:disabled) { border-color: var(--accent-border); color: var(--accent); }
.msg-btn.primary { background: var(--accent-subtle); border-color: var(--accent-border); color: var(--accent); }
.msg-btn.danger { background: var(--red-subtle); border-color: var(--red-border); color: var(--red); }
.msg-pagination { display: flex; align-items: center; justify-content: center; gap: 14px; }
.msg-pagination span { font-size: 12.5px; color: var(--fg-muted); }
.msg-conv-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.msg-conv-card {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; min-width: 0; max-width: 100%;
  padding: 13px 14px; border-radius: var(--radius-lg);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
}
.msg-conv-card:hover { border-color: var(--accent-border); }
.msg-conv-avatar {
  width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-subtle); border: 1px solid var(--accent-border); color: var(--accent); font-weight: 700;
}
.msg-conv-avatar.call { background: var(--amber-subtle); border-color: var(--amber); color: var(--amber); }
.msg-conv-main { flex: 1; min-width: 0; }
.msg-conv-top { display: flex; align-items: baseline; gap: 8px; }
.msg-conv-top strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14.5px; }
.msg-conv-meta { font-size: 11px; color: var(--fg-muted); flex-shrink: 0; text-align: right; }
.msg-conv-meta em { font-style: normal; display: block; }
.msg-conv-sub { display: flex; gap: 8px; margin-top: 2px; align-items: center; }
.msg-tag { padding: 2px 9px; border-radius: 6px; font-size: 10.5px; background: var(--accent-subtle); color: var(--accent); }
.msg-conv-preview { flex: 1; min-width: 0; font-size: 12.5px; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg-chat-panel { display: flex; flex-direction: column; gap: 12px; }
.msg-chat-header { display: flex; align-items: center; gap: 10px; }
.msg-icon-btn { width: 36px; height: 36px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--fg-dim); }
.msg-icon-btn.danger { background: var(--red-subtle); border-color: var(--red-border); color: var(--red); }
.msg-chat-identity strong { display: block; font-size: 15px; }
.msg-chat-identity small { font-size: 11.5px; }
.msg-chat-body { display: flex; flex-direction: column; gap: 9px; max-height: 52vh; overflow-y: auto; padding: 4px 2px; }
.msg-bubble { max-width: 84%; padding: 10px 13px; border-radius: 12px; font-size: 13.5px; }
.msg-bubble.in { align-self: flex-start; background: var(--bg-card2); border: 1px solid var(--border-subtle); border-bottom-left-radius: 4px; }
.msg-bubble.out { align-self: flex-end; background: var(--accent-subtle); border: 1px solid var(--accent-border); color: var(--fg); border-bottom-right-radius: 4px; }
.msg-bubble.call { align-self: center; background: var(--amber-subtle); border: 1px solid var(--amber); }
.msg-bubble-text { word-break: break-all; }
.msg-bubble-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 10px; opacity: 0.85; }
.msg-bubble-meta .mono { font-size: 10.5px; color: var(--fg-muted); }
.msg-bubble-actions { display: flex; gap: 7px; margin-top: 6px; }
.msg-bubble-actions button { font-size: 11px; padding: 4px 10px; border-radius: 6px; background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--fg-dim); display: inline-flex; align-items: center; }
.msg-empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px 16px; color: var(--fg-muted); font-size: 13.5px; }
.msg-empty-icon { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--accent-subtle); color: var(--accent); }

/* ============ 扫描页 ============ */
.scan-panel {
  padding: 16px; border-radius: var(--radius-lg);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
  display: flex; flex-direction: column; gap: 12px;
}
.scan-panel label > span { font-size: 11.5px; color: var(--fg-muted); margin-bottom: 5px; }
.scan-status .status-line { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--fg-dim); margin-bottom: 7px; }
.progress { height: 8px; border-radius: 999px; background: var(--bg-input); border: 1px solid var(--border-subtle); overflow: hidden; }
.progress > div { height: 100%; background: var(--grad-accent); transition: width .3s; }

/* ============ 任务中心 ============ */
.tasks-page { gap: 14px; }
.task-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.task-tabs button {
  flex: 1; min-width: 100px; padding: 10px 8px; border-radius: var(--radius); font-size: 13.5px; color: var(--fg-dim);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
}
.task-tabs button.active { color: var(--on-accent); background: var(--grad-accent); border-color: transparent; font-weight: 600; }
.task-action-grid { display: grid; gap: 14px; }
.task-card {
  min-width: 0; max-width: 100%;
  padding: 16px; border-radius: var(--radius-lg);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
  display: flex; flex-direction: column; gap: 11px;
}
.task-card-title { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; }
.task-card p { margin: 0; font-size: 12.5px; }
.task-field { display: flex; flex-direction: column; gap: 9px; }
.task-field label > span { font-size: 11.5px; color: var(--fg-muted); margin-bottom: 0; }
.task-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.task-actions { display: flex; gap: 9px; flex-wrap: wrap; }
.task-actions > * { flex: 1; min-width: 104px; }
.task-info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.task-info-grid > div {
  padding: 11px 8px; border-radius: var(--radius); text-align: center;
  background: var(--bg-card2); border: 1px solid var(--border-subtle);
}
.task-info-grid span { display: block; font-size: 10.5px; color: var(--fg-muted); }
.task-info-grid strong { font-size: 12px; color: var(--fg); word-break: break-all; }

/* ============ 个人资料 ============ */
.profile-page { gap: 16px; }
.profile-hero {
  display: flex; align-items: center; gap: 16px;
  padding: 24px 20px; border-radius: var(--radius-lg);
  background: var(--grad-hero);
  box-shadow: 0 8px 24px var(--accent-glow);
}
.profile-avatar {
  width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5);
  color: var(--on-accent); font-size: 24px; font-weight: 800;
}
.profile-hero h1 { font-size: 19px; color: var(--on-accent); }
.profile-hero p { margin: 3px 0 0; font-size: 12.5px; color: var(--on-accent); opacity: 0.85; }
.profile-badge {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 7px;
  padding: 3px 11px; border-radius: 999px; font-size: 11px; font-weight: 600;
  background: rgba(255, 255, 255, 0.18); color: var(--on-accent); border: 1px solid rgba(255, 255, 255, 0.35);
}
.profile-section {
  padding: 6px 16px; border-radius: var(--radius-lg);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
}
.profile-section h2 { font-size: 13px; color: var(--fg-muted); font-weight: 600; padding: 13px 0 9px; border-bottom: 1px solid var(--border-subtle); }
.po-icon {
  width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-subtle); color: var(--accent);
}
.po-main { flex: 1; min-width: 0; }
.po-main strong { display: block; font-size: 14.5px; font-weight: 600; }
.po-main small { font-size: 11.5px; }
.profile-meta { display: flex; flex-direction: column; }
.profile-meta > div { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--border-subtle); font-size: 14px; gap: 10px; }
.profile-meta > div:last-child { border-bottom: none; }
.profile-meta span { color: var(--fg-muted); font-size: 13px; flex-shrink: 0; }
.profile-meta strong { font-size: 13.5px; color: var(--fg); text-align: right; word-break: break-all; }
.profile-row { display: flex; align-items: center; gap: 13px; width: 100%; padding: 13px 0; border-bottom: 1px solid var(--border-subtle); text-align: left; font-size: 14.5px; color: var(--fg); }
.profile-row:last-child { border-bottom: none; }
.profile-row .arrow { margin-left: auto; color: var(--accent); flex-shrink: 0; }
.profile-row.danger { color: var(--red); }
.profile-row.danger .po-icon { background: var(--red-subtle); color: var(--red); }
.profile-foot { text-align: center; font-size: 11.5px; color: var(--fg-muted); padding: 4px 0 10px; }

.serial-page { gap: 14px; }
.serial-hero {
  padding: 18px; border-radius: var(--radius-lg);
  background: var(--grad-hero);
}
.serial-hero h1 { font-size: 19px; color: var(--on-accent); }
.serial-hero p { margin: 4px 0 0; font-size: 12.5px; color: var(--on-accent); opacity: 0.85; }
.serial-hero-actions { display: flex; gap: 9px; margin-top: 13px; flex-wrap: wrap; }
.serial-hero-actions button {
  padding: 9px 15px; border-radius: var(--radius); font-size: 12.5px; font-weight: 600;
  background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.35); color: var(--on-accent);
}
.serial-panel {
  padding: 16px; border-radius: var(--radius-lg);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
  display: flex; flex-direction: column; gap: 12px;
}
.panel-title { font-size: 15px; font-weight: 700; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.panel-title h2 { font-size: 15px; display: flex; align-items: center; gap: 7px; }
.panel-title p { margin: 2px 0 0; font-size: 11.5px; color: var(--fg-muted); font-weight: 400; }
.multi-serial-layout { display: grid; gap: 14px; }
.multi-port-list { display: grid; gap: 9px; }
.multi-port-card {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--radius);
  background: var(--bg-card2); border: 1px solid var(--border-subtle);
}
.multi-port-card > input[type="checkbox"] { flex-shrink: 0; }
.multi-port-card > button { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-align: left; }
.multi-port-card.selected { border-color: var(--accent-border); background: var(--accent-subtle); }
.multi-port-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border-subtle); flex-shrink: 0; }
.multi-port-dot.connected { background: var(--green); }
.multi-port-card strong { flex-shrink: 0; font-size: 13.5px; }
.multi-port-card small { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; font-size: 11.5px; }
.multi-port-card em { font-style: normal; flex-shrink: 0; font-size: 11px; color: var(--fg-muted); }
.port-selection-actions { display: flex; gap: 9px; flex-wrap: wrap; }
.compact-connect-box { display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--border-subtle); padding-top: 12px; }
.compact-connect-box label > span { font-size: 11.5px; color: var(--fg-muted); margin-bottom: 0; }
.compact-button-row { display: flex; gap: 8px; flex-wrap: wrap; }
.compact-button-row .secondary-button { flex: 1; min-width: 88px; }
.wizard-section { padding: 14px; border-radius: var(--radius); background: var(--bg-card2); border: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 10px; }
.wizard-section-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.wizard-section-title small { font-weight: 400; }
.wizard-step-number {
  width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--grad-accent); color: var(--on-accent); font-size: 12px; font-weight: 700;
}
.wizard-required-note { font-size: 11.5px; color: var(--amber); }
.optional-wizard-section { opacity: 0.92; }
.compact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.compact-footer-actions { display: flex; gap: 9px; flex-wrap: wrap; }
.compact-footer-actions > * { flex: 1; min-width: 110px; }
.channel-compact-grid { display: grid; gap: 10px; }
.channel-compact-grid > div { padding: 12px; border-radius: var(--radius); background: var(--bg-card2); border: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 8px; }
.serial-ota-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.serial-ota-bar input { flex: 1; min-width: 130px; }
.terminal-surface {
  border-radius: var(--radius); overflow: hidden;
  background: var(--bg-input); border: 1px solid var(--border-subtle);
  max-height: 260px; overflow-y: auto;
}
.terminal-row { display: flex; gap: 9px; padding: 5px 12px; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11.5px; border-bottom: 1px solid var(--border-subtle); }
.terminal-row:last-child { border-bottom: none; }
.terminal-time { color: var(--fg-muted); flex-shrink: 0; }
.terminal-level { flex-shrink: 0; font-weight: 600; min-width: 30px; }
.terminal-row-rx .terminal-level { color: var(--green); }
.terminal-row-tx .terminal-level { color: var(--accent); }
.terminal-row-system .terminal-level { color: var(--amber); }
.terminal-empty { padding: 26px; text-align: center; color: var(--fg-muted); font-size: 12.5px; font-family: inherit; }
.log-count { font-size: 12px; color: var(--fg-muted); }
.saved { color: var(--green); font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; }
.status-line { font-size: 12.5px; color: var(--fg-muted); }

/* ============ 自更新条 ============ */
.self-update-bar {
  display: flex; align-items: center; gap: 11px; flex-wrap: wrap;
  padding: 12px 14px; border-radius: var(--radius-lg);
  background: var(--bg-card); border: 1px solid var(--border-subtle);
}
.self-update-main { flex: 1; min-width: 150px; }
.self-update-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.self-update-title .has-update { color: var(--amber); }
.self-update-meta { font-size: 11px; color: var(--fg-muted); margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; }
.self-update-msg { font-size: 12px; color: var(--accent); }
.self-update-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.self-update-actions button { padding: 8px 13px; border-radius: 8px; font-size: 12.5px; background: var(--bg-card2); border: 1px solid var(--border-subtle); color: var(--fg-dim); display: inline-flex; align-items: center; gap: 5px; }
.self-update-actions .btn-primary { background: var(--grad-accent); color: var(--on-accent); border-color: transparent; }

/* ============ Toast ============ */
#toast-root { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow-float); animation: toast-in .2s ease; max-width: min(86vw, 480px); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ============ 响应式：≥960px 铺开为桌面版 ============ */
@media (min-width: 960px) {
  .content-topnav { padding: 22px 30px calc(var(--tabbar-h) + 30px); max-width: 1280px; }
  .bottom-nav { background: transparent; border-top: none; pointer-events: none; }
  .bottom-nav-group {
    max-width: 560px; pointer-events: auto;
    background: var(--bar); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg); height: 58px;
    box-shadow: var(--shadow-float);
    overflow: hidden;
  }
  .bottom-nav-item.active::before { top: auto; bottom: 0; border-radius: 2px 2px 0 0; }
  .device-list { grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); }
  .dash-device-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
  .msg-conv-list { grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); }
  .task-action-grid { grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
  .mode-choice-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 860px; margin-left: auto; margin-right: auto; }
  .multi-serial-layout { grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
  .dash-stats { max-width: 860px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function fmtTime(ts){
  if(!ts) return '-';
  var d=new Date(ts*1000), n=new Date();
  if(d.toDateString()===n.toDateString()) return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
  return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
}
function fmtFull(ts){ return ts? new Date(ts*1000).toLocaleString('zh-CN',{hour12:false}) : '-'; }
function fmtDur(s){ if(!s||s<=0) return '-'; var m=Math.floor(s/60),x=s%60; return m>0? m+' 分 '+x+' 秒' : x+' 秒'; }
function uptimeLabel(v){ if(!v) return '-'; if(v<60) return v+' 秒'; if(v<3600) return Math.floor(v/60)+' 分 '+(v%60)+' 秒'; return Math.floor(v/3600)+' 时 '+Math.floor((v%3600)/60)+' 分'; }
function toast(msg){
  var r=document.getElementById('toast-root');
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg; r.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(function(){ t.remove(); },300); }, 2400);
}

  if(S.filterStatus==='nosim') list=list.filter(function(d){return !(d.sim1.present||d.sim1.number)&&!(d.sim2.present||d.sim2.number);});
  return list;

function batchRemove(){
  var cbs=document.querySelectorAll('.dev-card-check:checked');
  var n=cbs.length;
  if(!n) return;
  if(!confirm('确认删除选中的 '+n+' 台设备？')) return;
  var all=document.querySelectorAll('.dev-card-check');
  var ids=[];
  cbs.forEach(function(cb){
    var idx=[].indexOf.call(all, cb);
    var visible=filteredDevices();
    if(visible[idx]) ids.push(visible[idx].id);
  });
  S.devices=S.devices.filter(function(d){return ids.indexOf(d.id)<0;});
  setNotice('已删除 '+n+' 台设备');
}
function removeDev(id){
  var d=S.devices.find(function(x){return x.id===id;});
  if(!confirm('删除设备 '+(d?d.name||d.ip:'')+'？')) return;
  S.devices=S.devices.filter(function(x){return x.id!==id;});
  setNotice('设备已删除');
}

function addDev(){
  var ip=document.getElementById('add-ip').value.trim();
  if(!ip) return;
  S.devices.push({ id:Date.now(), name:ip, group:'手动添加', ip:ip, status:'online', version:'4.0', uptime:60,
    sim1:{present:false,number:'',operator:'',registered:false,signal:0},
    sim2:{present:false,number:'',operator:'',registered:false,signal:0},
    wifi:{name:''} });

function openSms(id){
  S._smsDev=S.devices.find(function(x){return x.id===id;});
  openModal(
    '<div class="modal-header"><h2>发送短信</h2><button onclick="closeModal()">✕</button></div>'+

function sendSms(){
  var phone=document.getElementById('sms-phone').value.trim(), content=document.getElementById('sms-content').value.trim();
  if(!phone||!content){ toast('请填写号码与内容'); return; }
  var slot=document.getElementById('sms-slot').value;
  S.msgs.push({ id:Date.now(), phone:phone, deviceId:S._smsDev.id, deviceName:S._smsDev.name, simSlot:slot, direction:'out', content:content, time:Date.now()/1000 });
  closeModal(); setNotice('短信已通过 '+S._smsDev.name+' SIM'+slot+' 发送');
}

function conversations(){
  var map={};
  S.msgs.forEach(function(m){
    var k=m.phone+'|'+m.deviceName+'|'+m.simSlot;
    if(!map[k]) map[k]={key:k, phone:m.phone, deviceName:m.deviceName, simSlot:m.simSlot, lastContent:m.content, lastTime:m.time, count:1, hasCall:false};
    else { map[k].count++; if(m.time>=map[k].lastTime){ map[k].lastTime=m.time; map[k].lastContent=m.content; } }
  });
  S.calls.forEach(function(cl){
    var k=cl.phone+'|'+cl.deviceName+'|'+cl.simSlot;
    if(!map[k]) map[k]={key:k, phone:cl.phone, deviceName:cl.deviceName, simSlot:cl.simSlot, lastContent:'来电记录', lastTime:cl.createdAt, count:1, hasCall:true};
    else { map[k].hasCall=true; map[k].count++; if(cl.createdAt>=map[k].lastTime){ map[k].lastTime=cl.createdAt; map[k].lastContent='来电记录'; } }
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return b.lastTime-a.lastTime;});
}
function renderMessages(){
  if(S.chatKey){ return renderChat(); }

    if(S.msgMode==='out'&&m.direction!=='out') return false;
    var q=S.search.toLowerCase();
    if(!q) return true;

  });

            '<td class="mono muted">'+esc(m.deviceName)+'</td><td>SIM'+m.simSlot+'</td>'+
            '<td class="mono muted">'+fmtFull(m.time)+'</td>'+
            '<td><button class="msg-icon-btn danger" onclick="delMsg('+m.id+')" title="删除">'+ic('trash',14)+'</button></td></tr>';
        }).join('')+'</tbody></table></div>'+
        '<div class="msg-pagination"><button class="msg-btn" disabled>'+ic('left',14)+' 上一页</button><span>1 / 1 · 共 '+filtered.length+' 条</span><button class="msg-btn" disabled>下一页 '+ic('right',14)+'</button></div>';

        calls.map(function(cl){

            '<td class="mono muted">'+esc(cl.deviceName)+'</td><td>SIM'+cl.simSlot+'</td><td>'+fmtDur(cl.duration)+'</td>'+
            '<td class="mono muted">'+fmtFull(cl.createdAt)+'</td></tr>';
        }).join('')+'</tbody></table></div>';
  }
  return layout('<div class="msg-page">'+
    '<div class="msg-stats">'+
      '<div class="msg-stat"><div class="msg-stat-value">'+stats.total+'</div><div class="msg-stat-label">总短信</div></div>'+
      '<div class="msg-stat"><div class="msg-stat-value">'+stats.today+'</div><div class="msg-stat-label">今日</div></div>'+
      '<div class="msg-stat"><div class="msg-stat-value">'+stats.week+'</div><div class="msg-stat-label">本周</div></div>'+
      '<div class="msg-stat"><div class="msg-stat-value">'+stats.failed+'</div><div class="msg-stat-label">失败</div></div>'+
    '</div>'+
    '<div class="msg-toolbar">'+
      '<div class="msg-toolbar-left">'+
        '<div class="msg-search-wrap">'+ic('search',15)+'<input placeholder="搜索号码 / 内容 / 设备..." value="'+esc(S.search)+'" oninput="S.search=this.value" onchange="render()"></div>'+
        '<select style="max-width:130px" onchange="S.msgMode=this.value;render()"><option value="">全部方向</option><option value="in" '+(S.msgMode==='in'?'selected':'')+'>仅收到</option><option value="out" '+(S.msgMode==='out'?'selected':'')+'>仅发出</option></select>'+
      '</div>'+
      '<div class="msg-toolbar-right">'+
        '<button class="msg-btn primary" onclick="toast(\'同步完成：新增 0 条\')">'+ic('download',14)+'从设备同步</button>'+

      '<button class="'+(S.lanTabMsg==='messages'?'active':'')+'" onclick="S.lanTabMsg=\'messages\';S.chatKey=null;render()">全部短信<em>'+stats.total+'</em></button>'+
      '<button class="'+(S.lanTabMsg==='calls'?'active':'')+'" onclick="S.lanTabMsg=\'calls\';S.chatKey=null;render()">通话记录<em>'+calls.length+'</em></button>'+
    '</div>'+

}
function openChat(key){ S.chatKey=key; render(); }
function chatItems(cv){
  var items=[];
  S.msgs.forEach(function(m){
    if((m.phone+'|'+m.deviceName+'|'+m.simSlot)===cv.key) items.push({type:'msg', time:m.time, data:m});
  });
  S.calls.forEach(function(cl){
    if((cl.phone+'|'+cl.deviceName+'|'+cl.simSlot)===cv.key) items.push({type:'call', time:cl.createdAt, data:cl});
  });
  return items.sort(function(a,b){return a.time-b.time;});
}
function renderChat(){
  var cv=conversations().find(function(x){return x.key===S.chatKey;});
  if(!cv){ S.chatKey=null; return renderMessages(); }
  var items=chatItems(cv);
  var bubbles=items.map(function(it){
    if(it.type==='call'){
      return '<div class="msg-bubble call"><div class="msg-bubble-meta"><span class="msg-pill call">来电</span><span class="mono">'+fmtFull(it.data.createdAt)+'</span></div><div class="msg-bubble-text muted">来电记录 · 时长 '+fmtDur(it.data.duration)+'</div></div>';
    }
    var m=it.data, isOut=m.direction==='out';
    return '<div class="msg-bubble '+(isOut?'out':'in')+'">'+
      '<div class="msg-bubble-meta"><span class="msg-pill '+(isOut?'out':'in')+'">'+(isOut?'发出':'收到')+'</span><span class="mono">'+fmtFull(m.time)+'</span></div>'+
      '<div class="msg-bubble-text">'+esc(m.content)+'</div>'+
      '<div class="msg-bubble-actions"><button onclick="delMsg('+m.id+',\'chat\')">'+ic('trash',12)+' 删除</button></div>'+
    '</div>';
  }).join('');
  return layout('<div class="msg-page"><div class="msg-chat-panel">'+
    '<div class="msg-chat-header">'+
      '<button class="msg-icon-btn" onclick="S.chatKey=null;render()" title="返回">'+ic('left',18)+'</button>'+
      '<div class="msg-chat-identity"><strong>'+esc(cv.phone)+'</strong><span class="muted">'+esc(cv.deviceName)+(cv.simSlot?' · SIM'+cv.simSlot:'')+' · '+cv.count+' 条</span></div>'+
    '</div>'+
    '<div class="msg-chat-body">'+(bubbles||'<div class="msg-empty">暂无消息</div>')+'</div>'+
  '</div></div>');
}
function delMsg(id, fromChat){
  if(!confirm('确认删除这条短信？')) return;
  S.msgs=S.msgs.filter(function(m){return m.id!==id;});
  if(fromChat){ render(); toast('已删除'); } else { setNotice('已删除'); }
}
function clearMsgs(){
  if(!confirm('确认清空全部短信记录？此操作不可恢复。')) return;
  S.msgs=[]; S.chatKey=null;
  setNotice('已清空全部记录');
}

function renderScan(){
  var st=S.scanStatus;
  var progress=st&&st.total?Math.round((st.total-st.pending)/st.total*100):0;
  var rows=(!st||st.results.length===0)
    ? '<tr><td colspan="3" class="empty">暂无扫描结果。输入网段后点击“开始扫描”。</td></tr>'
    : st.results.map(function(r){
        return '<tr><td><code>'+r.ip+'</code></td><td>'+(r.success?'已识别设备':(r.httpOpen?'未识别或未升级固件':'未开放 HTTP'))+'</td>'+
          '<td>'+(r.auto?'<span class="saved">'+ic('save',14)+' 已自动加入</span>':'-')+'</td></tr>';
      }).join('');
  return layout('<section class="page">'+
    '<div class="page-hero"><div><span class="eyebrow">Sector Scan</span><h1>星域扫描</h1><p>只识别带 LAN 密钥发现接口的短信转发节点，识别成功后自动加入节点列表。</p></div></div>'+
    '<div class="scan-panel">'+
      '<label><span>CIDR 网段</span><input id="scan-cidr" placeholder="留空自动识别，或 192.168.123.0/24"></label>'+
      '<label><span>设备用户名</span><input value="admin"></label>'+
      '<label><span>设备密码</span><input type="password" value="admin"></label>'+
      '<button class="primary-button" onclick="startScan()" '+(S.scanRunning?'disabled':'')+'>'+ic('radar',16)+' '+(S.scanRunning?'扫描中...':'开始扫描')+'</button>'+
    '</div>'+
    (st?'<div class="scan-status"><div class="status-line"><strong>'+st.cidr+'</strong><span>'+(st.auto?'自动识别 · ':'')+progress+'% · 发现 '+st.found+' · 剩余 '+st.pending+'</span></div><div class="progress"><div style="width:'+progress+'%"></div></div></div>':'')+
    '<div class="msg-table-wrap"><table class="msg-table"><thead><tr><th>IP</th><th>结果</th><th>状态 / 操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '</section>');
}
function startScan(){
  if(S.scanRunning) return;
  S.scanRunning=true;
  var input=document.getElementById('scan-cidr');
  var cidr=(input&&input.value.trim())||'192.168.123.0/24';
  var auto=!(input&&input.value.trim());
  var ips=['192.168.123.21','192.168.123.22','192.168.123.23','192.168.123.24','192.168.123.50'];
  S.scanStatus={cidr:cidr, auto:auto, total:ips.length, pending:ips.length, found:0, results:ips.map(function(ip){return {ip:ip, success:false, httpOpen:true, auto:false};})};
  render();
  var i=0;
  clearInterval(S.scanTimer);
  S.scanTimer=setInterval(function(){
    if(i>=ips.length){
      clearInterval(S.scanTimer); S.scanRunning=false;
      S.scanStatus.pending=0;
      render(); toast('扫描完成，发现 4 台设备');
      return;
    }
    if(i<4){ S.scanStatus.results[i].success=true; S.scanStatus.results[i].auto=true; S.scanStatus.found++; }
    S.scanStatus.pending--;
    i++; render();
  }, 550);
}

function runTaskScan(){

    '<p class="profile-foot">T3 本地设备助手 · 局域网设备运维 · 串口模式随时切换</p>'+
  '</section>');
}

/* ============================ 串口工作台 ============================ */
function startSerialFeed(){
  if(S.serialTimer) return;
  var samples=[['rx','AT'],['tx','OK'],['rx','AT+CSQ'],['tx','+CSQ: 22,0'],['rx','AT+COPS?'],['tx','+COPS: 0,0,"CMCC",7'],['system','[state] wifi connected'],['rx','AT+CMGF=1'],['tx','OK']];
  var n=0;
  S.serialTimer=setInterval(function(){
    if(!S.serialConnected || S.view!=='serial'){ return; }
    n++;
    var s=samples[n%samples.length];
    S.serialLogs.push({level:s[0], content:s[1], time:Date.now()/1000});
    if(S.serialLogs.length>300) S.serialLogs=S.serialLogs.slice(-300);
    renderSerialLogsOnly();
  }, 2600);
}
function renderSerialLogsOnly(){
  var box=document.getElementById('terminal');
  if(!box) return;
  var logs=S.serialLogs.slice(-200).reverse();
  box.innerHTML=logs.length===0?'<div class="terminal-empty">连接后显示日志</div>':logs.map(serialRow).join('');
}
function serialRow(l){
  var labels={rx:'接收',tx:'发送',system:'系统',error:'错误'};
  return '<div class="terminal-row terminal-row-'+l.level+'"><span class="terminal-time">'+(l.time?new Date(l.time*1000).toLocaleTimeString('zh-CN',{hour12:false}):'--:--:--')+'</span><span class="terminal-level">'+(labels[l.level]||l.level)+'</span><code>'+esc(l.content)+'</code></div>';
}
function renderSerial(){
  var connected=S.serialConnected;
  var sel=S.selectedPorts.filter(function(p){return S.ports.find(function(x){return x.name===p&&x.connected;});});
  var rx=S.serialLogs.filter(function(l){return l.level==='rx';}).length;
  var tx=S.serialLogs.filter(function(l){return l.level==='tx';}).length;
  var portCards=S.ports.map(function(p){
    var selected=S.selectedPorts.indexOf(p.name)>=0;
    return '<div class="multi-port-card'+(S.activePort===p.name?' active':'')+(p.connected?' connected':'')+(selected?' selected':'')+'">'+
      '<input type="checkbox" '+(selected?'checked':'')+' onchange="togglePortSel(\''+p.name+'\',this.checked)">'+
      '<button onclick="selectPort(\''+p.name+'\')"><span class="multi-port-dot'+(p.connected?' connected':'')+'"></span><strong>'+p.name+'</strong><small>'+esc(p.description)+'</small><em>'+(p.connected?(p.baudrate+' · 实时'):'未连接')+'</em></button>'+
    '</div>';
  }).join('');
  var ch=S.serialChannels[S.serialChannel];
  var chTabs=S.serialChannels.map(function(_,idx){
    return '<button class="'+(S.serialChannel===idx?'active':'')+'" onclick="S.serialChannel='+idx+';render()">通道 '+(idx+1)+'</button>';
  }).join('');
  var logs=S.serialLogs.slice(-200).reverse();
  return layout('<section class="page serial-page">'+
    '<div class="serial-hero"><div><span class="eyebrow">Serial Desk</span><h1>串口工作台</h1>'+
      '<p>集中处理多串口连接、设备配置读写、配置复刻、导入导出、诊断、DTR/RTS 控制与底部实时日志。</p></div>'+
      '<div class="serial-hero-actions">'+
        '<button onclick="toast(\'已刷新串口状态\')">'+ic('refresh',16)+'刷新</button>'+
        '<button onclick="toggleConnect()">'+ic(connected?'unplug':'plug',16)+(connected?'断开当前':'连接当前')+'</button>'+
      '</div>'+
    '</div>'+
    noticeHtml()+
    '<div class="version-banner"><span>T3服务端 v1.5.2</span><span>OTA 服务器 v4.0</span><span>串口设备 '+(connected?'4.0':'请选择串口检测')+'</span></div>'+
    '<div class="multi-serial-layout">'+
      '<aside class="serial-panel">'+
        '<div class="panel-title"><div><h2>'+ic('cable',17)+' 串口列表</h2><p>'+S.ports.filter(function(p){return p.connected;}).length+' 个已连接 · 已选 '+sel.length+' 个</p></div></div>'+
        '<div class="multi-port-list">'+portCards+'</div>'+
        '<div class="port-selection-actions">'+
          '<button class="secondary-button" onclick="selAllConnected()">全选已连接</button>'+
          '<button class="secondary-button" onclick="S.selectedPorts=[];render()">清空</button>'+
        '</div>'+
        '<div class="compact-connect-box">'+
          '<label><span>波特率</span><input type="number" value="'+S.baudrate+'" onchange="S.baudrate=Number(this.value)||115200" '+(connected?'disabled':'')+'></label>'+
          '<label><span>模式</span><select '+(connected?'disabled':'')+'><option value="cdc" selected>稳定连接</option><option value="safe">防复位</option><option value="normal">标准</option></select></label>'+
          '<div class="compact-button-row">'+
            (connected
              ?'<button class="secondary-button" onclick="toggleConnect()">'+ic('unplug',15)+'断开</button>'
              :'<button class="secondary-button" onclick="toggleConnect()">'+ic('plug',15)+'连接</button>')+
            '<button class="secondary-button" onclick="toast(\'已读取 '+S.activePort+' 的配置\')">'+ic('download',15)+'读取</button>'+
            '<button class="secondary-button" onclick="toast(\'串口设备固件版本：4.0\')">'+ic('save',15)+'检测版本</button>'+
          '</div>'+
        '</div>'+
      '</aside>'+
      '<main class="serial-panel">'+
        '<div class="panel-title"><div><h2>'+ic('wifi',17)+' 配置编辑</h2><p>'+S.activePort+' · '+(connected?'已读取':'未读取')+'</p></div>'+
          '<div class="serial-hero-actions" style="margin:0">'+
            '<button onclick="toast(\'已导出 t3-config.json\')">'+ic('filedown',15)+'导出</button>'+
            '<button onclick="toast(\'配置文件已导入\')">'+ic('fileup',15)+'导入</button>'+
          '</div>'+
        '</div>'+
        '<div class="wizard-section">'+
          '<div class="wizard-step-number">01</div>'+
          '<div class="wizard-section-title"><span>'+ic('wifi',16)+' 首次配置 WiFi</span><small>必填。设备保存后会尝试连接此 2.4 GHz 热点。</small></div>'+
          '<label><span>WiFi 名称 *</span><input value="'+esc(S.serialCfg.wifiSsid)+'" onchange="S.serialCfg.wifiSsid=this.value" placeholder="输入 2.4 GHz 热点名称"></label>'+
          '<label><span>WiFi 密码</span><div class="serial-command"><input type="'+(S.showWifiPass?'text':'password')+'" value="'+esc(S.serialCfg.wifiPass)+'" onchange="S.serialCfg.wifiPass=this.value" placeholder="开放热点可留空"><button type="button" class="secondary-button" onclick="S.showWifiPass=!S.showWifiPass;render()">'+(S.showWifiPass?'隐藏':'查看')+'</button></div></label>'+
          '<div class="wizard-required-note">WiFi 凭据只会写入选中的已连接串口，支持并行保存并返回逐端口结果。</div>'+
          '<button class="primary-button" onclick="toast(\'WiFi 已保存到已选串口（'+sel.length+'）\')">'+ic('wifi',16)+'保存 WiFi 到已选串口（'+sel.length+'）</button>'+
        '</div>'+
        '<div class="wizard-section optional-wizard-section">'+
          '<div class="wizard-step-number">02</div>'+
          '<div class="wizard-section-title"><span>可选配置</span><small>只有本次修改的内容才会写入。</small></div>'+
          '<div class="compact-grid">'+
            '<label class="full-field"><span>设备名称</span><input value="'+esc(S.serialCfg.deviceName)+'" onchange="S.serialCfg.deviceName=this.value" placeholder="不修改可保持原值"></label>'+
            '<label><span>SIM1 PIN</span><input type="password" value="'+esc(S.serialCfg.sim1Pin)+'" onchange="S.serialCfg.sim1Pin=this.value" placeholder="不设置请留空"></label>'+
            '<label><span>SIM2 PIN</span><input type="password" value="'+esc(S.serialCfg.sim2Pin)+'" onchange="S.serialCfg.sim2Pin=this.value" placeholder="不设置请留空"></label>'+
          '</div>'+
        '</div>'+
        '<div>'+
          '<div class="wizard-section-title" style="margin-bottom:8px"><span>可选转发通道</span><small>通道按固定位置写入；默认模板包含备注字段。</small></div>'+
          '<div class="channel-tabs" style="margin-bottom:10px">'+chTabs+'</div>'+
          '<div class="channel-compact-grid">'+
            '<div><label><span>类型</span><select onchange="S.serialChannels['+S.serialChannel+'].type=Number(this.value);render()">'+CHANNEL_TYPES.map(function(n,idx){return '<option value="'+idx+'"'+(ch.type===idx?' selected':'')+'>'+n+'</option>';}).join('')+'</select></label>'+
            '<label><span>URL</span><textarea onchange="S.serialChannels['+S.serialChannel+'].url=this.value">'+esc(ch.url)+'</textarea></label>'+
            '<div class="compact-grid"><label><span>参数1</span><input value="'+esc(ch.key1)+'" onchange="S.serialChannels['+S.serialChannel+'].key1=this.value"></label><label><span>参数2</span><input value="'+esc(ch.key2)+'" onchange="S.serialChannels['+S.serialChannel+'].key2=this.value"></label></div>'+
            '<label><span>模板</span><textarea onchange="S.serialChannels['+S.serialChannel+'].customBody=this.value">'+esc(ch.customBody)+'</textarea></label></div>'+
          '</div>'+
        '</div>'+
        '<div class="serial-ota-bar"><input placeholder="OTA 固件 URL"><button class="secondary-button" onclick="toast(\'OTA 已触发到已选串口\')">'+ic('download',15)+'全部已选设备 OTA</button></div>'+
        '<div class="compact-footer-actions">'+
          '<button class="primary-button" onclick="toast(\'批量配置已写入（'+sel.length+' 个串口）\')">'+ic('save',16)+'批量保存完整配置（'+sel.length+'）</button>'+
          '<button class="secondary-button" onclick="toast(\'诊断完成，已收到 48 字节\')">'+ic('activity',15)+'诊断</button>'+
          '<button class="secondary-button" onclick="toast(\'DTR 已切换\')">DTR</button>'+
          '<button class="secondary-button" onclick="toast(\'RTS 已切换\')">RTS</button>'+
          '<button class="secondary-button danger-button" onclick="toast(\'复位脉冲已发送\')">复位</button>'+
        '</div>'+
      '</main>'+
    '</div>'+
    '<section class="serial-panel">'+
      '<div class="panel-title"><div><h2>'+ic('receiver',17)+' 串口日志</h2><p>'+S.activePort+' · 轮询 · RX '+rx+' / TX '+tx+'</p></div><span class="log-count">'+S.serialLogs.length+'</span></div>'+
      '<div class="terminal-surface" id="terminal">'+(logs.length===0?'<div class="terminal-empty">连接后显示日志</div>':logs.map(serialRow).join(''))+'</div>'+
    '</section>'+
  '</section>');
}
function togglePortSel(name, checked){
  if(checked){ if(S.selectedPorts.indexOf(name)<0) S.selectedPorts.push(name); }
  else S.selectedPorts=S.selectedPorts.filter(function(p){return p!==name;});
  render();
}
function selectPort(name){
  S.activePort=name;
  var p=S.ports.find(function(x){return x.name===name;});
  S.serialConnected=Boolean(p&&p.connected);
  render();
}
function selAllConnected(){
  S.selectedPorts=S.ports.filter(function(p){return p.connected;}).map(function(p){return p.name;});
  render();
}
function toggleConnect(){
  var p=S.ports.find(function(x){return x.name===S.activePort;});
  if(!p) return;
  S.serialConnected=!p.connected;
  p.connected=S.serialConnected;
  if(S.serialConnected){ p.baudrate=S.baudrate; setNotice(S.activePort+' 已连接'); startSerialFeed(); }
  else { p.baudrate=0; setNotice(S.activePort+' 已断开'); }
}

/* ============================ 渲染入口 ============================ */
function render(){
  applyTheme();
  var app=document.getElementById('app');
  var html;
  if(S.view==='login') html=renderLogin();
  else if(S.view==='mode') html=layout(renderMode());
  else if(S.view==='dashboard') html=renderDashboard();
  else if(S.view==='devices') html=renderDevices();
  else if(S.view==='messages') html=renderMessages();
  else if(S.view==='scan') html=renderScan();
  else if(S.view==='tasks') html=renderTasks();
  else if(S.view==='profile') html=renderProfile();
  else if(S.view==='serial'){ html=renderSerial(); startSerialFeed(); }
  else html=renderLogin();
  app.innerHTML=html;
}
document.documentElement.dataset.theme=S.theme;
if(localStorage.getItem('t3-theme')!=='light'&&localStorage.getItem('t3-theme')!=='dark') localStorage.setItem('t3-theme','light');
// 与真实应用一致：token 有效时刷新后直接进入模式选择页
if(localStorage.getItem('token')==='demo-token') S.view='mode';
render();
</script>
</body>
</html>
