<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T3副卡宝 · 资料文档中心</title>
<style>
:root{--ink:#102033;--muted:#66758a;--line:#dbe7f3;--blue:#1769ff;--cyan:#00c2ff;--font:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);background:linear-gradient(180deg,#f8fbff 0%,#eef6ff 45%,#fff 100%);min-height:100vh;min-height:100dvh}
a{text-decoration:none;color:inherit}
.container{width:min(1120px,calc(100% - 44px));margin:auto}
/* ===== 顶部导航 ===== */
.nav{flex:none;position:sticky;top:0;z-index:50;background:rgba(248,251,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(219,231,243,.86)}
.nav-inner{height:64px;display:flex;align-items:center;justify-content:space-between;gap:22px}
.brand{display:flex;align-items:center;gap:12px;font-weight:900}
.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px rgba(23,105,255,.28);font-size:14px}
.brand small{display:block;color:var(--muted);font-weight:600;font-size:11px;margin-top:1px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:900;cursor:pointer;font-family:var(--font);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.25s;font-size:13px}
.btn-primary{color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 12px 28px rgba(23,105,255,.22)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(23,105,255,.3)}
.btn-ghost{background:#fff;color:var(--blue);border:1px solid var(--line);box-shadow:0 8px 22px rgba(21,77,140,.06)}
.btn-ghost:hover{transform:translateY(-2px)}
main{padding:40px 0 60px}
.lead{font-size:14px;color:var(--muted);margin:0 0 22px}
/* ===== 文档列表 ===== */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{display:flex;align-items:flex-start;gap:14px;padding:20px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 30px rgba(21,77,140,.06);transition:.25s}
.card:hover{border-color:rgba(23,105,255,.4);transform:translateY(-3px);box-shadow:0 18px 40px rgba(23,105,255,.12)}
.card .ico{font-size:26px;line-height:1;flex:none;width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#eaf2ff,#e6fbff);display:grid;place-items:center}
.card .meta{flex:1;min-width:0}
.card .tag{font-size:11.5px;font-weight:800;color:var(--blue);letter-spacing:.4px}
.card .meta b{display:block;font-size:16px;margin:4px 0 6px}
.card .meta p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.card .go{margin-top:12px;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan));padding:8px 16px;border-radius:999px;display:inline-flex;gap:5px;align-items:center}
.card .go:hover{transform:translateY(-1px)}
/* ===== 跳转中转态 ===== */
.redirect{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:90px 24px;min-height:62vh}
.redirect .ico{font-size:54px}
.redirect h2{margin:0;font-size:22px}
.redirect p{margin:0;color:var(--muted);font-size:14px;line-height:1.7;max-width:440px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
@media(max-width:760px){.grid{grid-template-columns:1fr}.nav-inner{height:58px}.brand small{display:none}}
</style>
</head>
<body>

<header class="nav"><div class="nav-inner container">
  <a class="brand" href="index.html"><span class="brand-mark">T3</span><span>T3副卡宝<small>资料文档中心</small></span></a>
  <a class="btn btn-ghost" href="index.html">返回主页</a>
</div></header>

<main class="container">
  <div id="view"></div>
</main>

<script>
// 飞书文档集中管理：长 URL 仅在此处出现一次，其余页面统一用 docs.html?d=xxx 短链接
// 资料已整合为飞书知识库（wiki），每篇对应一个 wiki 页面。由于飞书文档在 iframe 内
// 必须带 Cookie（Chrome 默认拦截第三方 Cookie → 弹登录），这里改为「短链中转 → 直接打开飞书」。
var DOCS=[
  {key:'fw',ico:'📟',tag:'固件操作 · FIRMWARE',name:'T3 固件操作说明',url:'https://caruue1og9.feishu.cn/wiki/KkcPwv4MDi1N77kPd9jc2Ab9n2c'},
  {key:'as',ico:'🖥️',tag:'本地助手 · ASSISTANT',name:'T3 本地助手操作说明',url:'https://caruue1og9.feishu.cn/wiki/VEBjwc0OyijRB3k9qkjczce6nvc'},
  {key:'setup',ico:'🧩',tag:'部署搭建 · SETUP',name:'T3 本地助手搭建说明',url:'https://caruue1og9.feishu.cn/wiki/XfDTwGZk9iZYBkkYJWWcu4z3nhg'},
  {key:'mqtt',ico:'🔌',tag:'开发手册 · MQTT DEV',name:'T3-MQTT 服务端开发手册',url:'https://caruue1og9.feishu.cn/wiki/RQXcwu0qyiMtvnkxegScXVHanjc'}
];
var view=document.getElementById('view');
var p=new URLSearchParams(location.search);
var d=DOCS.find(function(x){return x.key===p.get('d')});

if(d){
  // 中转态：短暂展示后直接跳转到对应飞书 wiki 页面（本页通常是 target=_blank 新标签打开，跳转后即为飞书页）
  document.title='正在打开：'+d.name+' · T3副卡宝';
  view.innerHTML=
    '<div class="redirect">'+
      '<div class="ico">📚</div>'+
      '<h2>正在打开《'+d.name+'》</h2>'+
      '<div class="spin"></div>'+
      '<p>即将在飞书知识库中打开。若未自动跳转，请点击下方按钮。</p>'+
      '<a class="btn btn-primary" href="'+d.url+'" target="_blank" rel="noopener">在飞书中打开 ↗</a>'+
    '</div>';
  // 略微延时后跳转，保证中转页可见、且避免被部分浏览器的瞬时跳转拦截
  setTimeout(function(){window.location.href=d.url;},350);
}else{
  // 无参数：作为资料中心首页，列出全部文档（每篇一个飞书 wiki 页面）
  document.title='T3副卡宝 · 资料文档中心';
  var html='<p class="lead">选择以下资料，将在飞书知识库中打开（新标签页）。</p><div class="grid">';
  DOCS.forEach(function(x){
    html+=
      '<a class="card" href="'+x.url+'" target="_blank" rel="noopener">'+
        '<span class="ico">'+x.ico+'</span>'+
        '<div class="meta"><span class="tag">'+x.tag+'</span><b>'+x.name+'</b>'+
        '<span class="go">在飞书中打开 ↗</span></div>'+
      '</a>';
  });
  html+='</div>';
  view.innerHTML=html;
}
</script>
</body>
</html>
